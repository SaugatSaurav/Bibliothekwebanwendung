<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="management.css">



<script>

function laderueckgabe_anfragen() {

    let request = new XMLHttpRequest();

    request.onreadystatechange = function() {
        if(request.readyState == 4) {
            if(request.status == 200) {
                let daten = JSON.parse(request.responseText);

                let liste = document.getElementById("reservierungsliste");

                liste.innerHTML = "";

                if(daten.length == 0) {
                    liste.innerHTML =  "<h3>Keine Rückgabeanfragen vorhanden.</h3>";
                    return;
                }


                let html = "";

                let aktuelleMitgliedId = -1;

                for(let i = 0; i < daten.length; i++) {

                    /*
                     * Wenn ein neues Mitglied beginnt,
                     * wird zuerst das alte Div geschlossen.
                     */
                    if(aktuelleMitgliedId != daten[i].mitgliedId) {

                        if(aktuelleMitgliedId != -1) {

                            html += "</div>";
                            html += "</div>";
                        }

                        aktuelleMitgliedId = daten[i].mitgliedId;

                        html +=
                            "<div class='reservierungsgruppe'>"
                            + "<div class='reservierungsgruppen-kopf'>"
                            + "<div>"

                            + "<h2>Mitglied: " + daten[i].mitgliedName + "</h2>"
                            + "<p>Mitglied-ID: "+ daten[i].mitgliedId + "</p>"
                            + "<p>E-Mail: " + daten[i].email + "</p>"

                            + "<p>Adresse: "+ daten[i].addresse + "</p>"

                            + "<p>Status-Mitglied: "
                            + "<span style='color:"+ (daten[i].mitgliedStatus == "AKTIV" ? "green": "red") + ";font-weight:bold'>"
                            + daten[i].mitgliedStatus + "</span>"  + "</p>"
                            + "</div>"

                            + "<button type='button' class='neues-buch-btn' onclick=\"allezurueckgeben('"
                            + daten[i].mitgliedId + "')\">" + "Alle Zurückgeben lassen" + "</button>"
                            + "</div>"

                            + "<div class='exemplar-liste'>";
                    }



                       let fehltageAnzeige = "";
                      if(daten[i].fehlTage >= 14) {
                        fehltageAnzeige =  "<p>Fehltage: " + daten[i].fehlTage
                      + " <span style='color:red;font-weight:bold'> (Überfällig)" + "</span>"  + "</p>";
                      } else {
                       fehltageAnzeige = "<p>Fehltage: " + daten[i].fehlTage  + "</p>";
                     }

                    html +=

                        "<div class='buchkarte'>"
                        + "<div class='buchIcon'>📘</div>"
                        + "<div class='buchInfo'>"
                        +"<h3>Exemplar ID: "+ daten[i].exemplarId + "</h3>"
                        + "<h3>Titel: " + daten[i].titel + "</h3>"
                        + "<p>Autor: " + daten[i].autor + "</p>"
                        + "<p>Genre: "+ daten[i].genre + "</p>"
                        + "<p>Barcode: "+ daten[i].barcode + "</p>"
                        + "<p>Standort: " + daten[i].standort + "</p>"
                        + "<p>Regal: " + daten[i].regal  + "</p>"
                        + "<p>Zustand: "+ daten[i].zustand + "</p>"
                        + "<p>Ausgeliehen am: "+ daten[i].ausgeliehenAm + "</p>"
                        + "<p>Rückgabedatum: "+ daten[i].zurueckgeben + "</p>"
                        + "<p>Gebühr: " + Number(daten[i].gebuehr).toFixed(2) + " €</p>"
                        + fehltageAnzeige
                        + "<p>Status: "
                        + "<span style='color:orange;font-weight:bold'>" + "Rückgabe angefragt" + "</span>" + "</p>"
                       
                        + "</div>"
                        
                        + "<div class='buchAktionen'>"

                        + "<label><b>Zustand prüfen:</b></label>"

                        + "<select class='zustandSelect zustand-mitglied-" + daten[i].mitgliedId
                        + "' data-exemplarid='"+ daten[i].exemplarId + "'>"

                        + "<option value=''>Bitte auswählen</option>"
                        + "<option value='GUT'>Gut</option>"
                        + "<option value='BESCHAEDIGT'>Beschädigt</option>"
                        + "</select>"

                        + "</div>"
                        + "</div>";
                    }


                /*
                 * Das letzte Mitglied-Div schließen.
                 */
                if(aktuelleMitgliedId != -1) {

                    html += "</div>";
                    html += "</div>";
                }
                liste.innerHTML = html;

            } else if(request.status == 401) {
                alert("Sie sind nicht eingeloggt.");

            } else {
                alert("Fehler beim Laden der Reservierungen.");
            }
        }
    };
    request.open("GET","mitarbeiterRueckgabeBenachrichtigung",true);
    request.send();
}



function allezurueckgeben(mitgliedId) {

    let selects =document.getElementsByClassName("zustand-mitglied-" + mitgliedId);

     if(selects.length == 0) {
        alert("Keine Rückgabeanfragen gefunden.");
        return;
     }


     for(let i = 0; i < selects.length; i++) {
        if(selects[i].value == "") {
            alert("Zuerst den Zustand von allen Exemplaren auswählen.");
            selects[i].focus();
            return;
        }
    }
     
    let antwort = confirm("Alle Exemplare dieses Mitglieds zurückgeben lassen?");

    if(antwort == false) {
        return;
    }

     let daten = "mitgliedid=" + mitgliedId;

    for(let i = 0; i < selects.length; i++) {
        let exemplarId = selects[i].getAttribute("data-exemplarid");

        daten +="&zustand_"+exemplarId + "=" + selects[i].value;
    }

 
    let request = new XMLHttpRequest();

    request.onreadystatechange = function() {
        if(request.readyState == 4) {
            if(request.status == 200) {
                 alert(request.responseText);
                 laderueckgabe_anfragen(); 

            }   else if(request.status == 400) {
                alert(request.responseText);

           } else if(request.status == 409) {
                alert("Keine offenen Rückgabeanfragen gefunden.");
               laderueckgabe_anfragen(); 
           
            } else if(request.status == 401) {
                alert("Sie sind nicht eingeloggt.");
          
            } else {
                alert("Fehler beim Zurückgeben.");
            }
        }
    };

    request.open("POST", "mitarbeiterRueckgabeBenachrichtigung", true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    request.send(daten);
}


    window.onload = function() {
      laderueckgabe_anfragen();
};

</script>
