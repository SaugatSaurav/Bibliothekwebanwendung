<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="management.css">

<script>
  const params = new URLSearchParams(window.location.search);

    let buchId = params.get("buch_id");

    function ladeExemplar() {
     
    let request = new XMLHttpRequest();

    request.onreadystatechange = function() {
      if(request.readyState == 4){
        if(request.status == 200) {

            let daten =JSON.parse(request.responseText);
            let liste =document.getElementById("buchliste");

            liste.innerHTML = "";

            for(let i=0;i<daten.length; i++) {
             
            liste.innerHTML +=

                "<div class='buchkarte' data-standort='" + daten[i].standort.toLowerCase() + "'>"
                +"<div class='buchIcon'>📘</div>"
                + "<div class='buchInfo'>"
                
                +"<h3>Exemplar ID: "+ daten[i].id+ "</h3>"
                +"<h3>Titel: "+ daten[i].titel+ "</h3>"
                + "<p>Autor: "+ daten[i].autor+ "</p>"
                + "<p>Barcode: "+ daten[i].barcode+ "</p>"
                + "<p>Standort: "+ daten[i].standort + "</p>"
                + "<p>Regal: "+ daten[i].regal+ "</p>"
                + "<p>Genre: "+ daten[i].genre+ "</p>"
                + "<p>Status: "
                + (daten[i].verfuegbar == 1 && (daten[i].zustand == "GUT" || daten[i].zustand == "NEU")
                     ? "<span style='color:green;font-weight:bold'>Verfügbar</span>"
                     : "") + "</p>"                                
               + "</div>"
               + "<div class='buchAktionen'>"
               + "<button onclick=\"reserviereExemplar('" + daten[i].id + "', this)\"> Reservieren </button>"
               + "<button onclick=\"addToWarenkorb('" + daten[i].id + "', this)\"> Im Warenkorb </button>"             
               + "</div>"
               + "</div>"
          }
        }  else if(request.status == 401) {
                alert("Sie sind nicht eingeloggt.");

            } else{
              alert("Fehler beim Laden des Exemplars");
            }
        }
    };
    request.open("GET", "mitgliedExemplar?buchid="+buchId, true);
    request.send();
}



function ladeStandorte() {
    let request = new XMLHttpRequest();

    request.onreadystatechange = function () {
        if (request.readyState == 4) {
            if (request.status == 200) {
                let standorte = JSON.parse(request.responseText);
                let select = document.getElementById("standortFilter");
                select.innerHTML = "<option value=''>Alle Standorte</option>";

                for (let i = 0; i < standorte.length; i++) {
                    select.innerHTML += "<option value='" + standorte[i].name.toLowerCase() + "'>"
                        + standorte[i].name + "</option>";
                }
            }
        }
    };
    request.open("GET", "standortliste", true);
    request.send();
}



 function filterStandort() {
    let selected = document.getElementById("standortFilter").value.toLowerCase();
    let karten = document.getElementsByClassName("buchkarte");

    for (let i = 0; i < karten.length; i++) {
        let standort = karten[i].getAttribute("data-standort");

        if (selected === "" || standort === selected) {
            karten[i].style.display = "flex";
        } else {
            karten[i].style.display = "none";
        }
    }
}


function reserviereExemplar(id, button) {
    let request = new XMLHttpRequest();

    request.onreadystatechange = function () {
        if (request.readyState == 4) {
            if (request.status == 200) {
                button.innerText = "Reserviert";
                button.disabled = true;
                button.style.backgroundColor = "gray";
             let buttons = button.parentElement.getElementsByTagName("button");

                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].disabled = true;
                }

            } else if (request.status == 409) {
                alert("Dieses Exemplar ist schon reserviert.");
                ladeExemplar();
          } 
            else {
                alert("Fehler beim Reservieren.");
            }
        }
    };

    request.open("POST", "exemplarReservieren", true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    request.send("exemplarid=" + id);
}


function addToWarenkorb(id, button) {
    let request = new XMLHttpRequest();

    request.onreadystatechange = function () {
        if (request.readyState == 4) {

            if (request.status == 200) {

                button.innerText = "Im Warenkorb hinzugefügt";
                button.style.backgroundColor = "gray";

                let buttons = button.parentElement.getElementsByTagName("button");

                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].disabled = true;
                }

            } else if (request.status == 409) {
                alert("Dieses Exemplar ist schon reserviert oder nicht mehr verfügbar.");
                ladeExemplar();

            } else {
                alert("Fehler beim Hinzufügen zum Warenkorb.");
            }
        }
    };

    request.open("POST", "warenkorb", true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    request.send("exemplarid=" + id);
}

 window.onload=function(){

 ladeExemplar();
 ladeStandorte();
 }


</script>
</head>

<body>
  
<div class="container">

    <div class="sidebar">

        <h2>Bibliothek</h2>

         <a id="yes" href="#">Home</a>
         <a href="mitgliedReservierung.html">Reservierten</a>
         <a href="mitgliedWarenkorb.html">Warenkorb</a>
         <a href="mitgliedAusleiheListe.html">Ausleihe Ansehen</a>
         <a href="mitgliedHistory.html">Historie</a>
           
    <form action="logout" method="POST">
      <button type="submit">Logout</button>
   </form>
    </div>

    <div class="content">

        <div class="page-header">
            <h1>Mitglied Home</h1>
      </div>


    <select id="standortFilter" onchange="filterStandort()">
     <option value="">Alle Standorte</option>
    </select>

<div id="buchliste">

</div>
    
</div>

</div>



</body>

</html>
