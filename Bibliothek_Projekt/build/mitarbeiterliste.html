<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="management.css">


<script>

 

function mitarbeiterLaden(){

let request=new XMLHttpRequest();

 request.onreadystatechange= function(){

 if(request.readyState==4){
   if(request.status==200){

   let inhalt=JSON.parse(request.responseText);
   let body=document.getElementById("tbody");
    body.innerHTML = "";

    for(let i=0;i<inhalt.length;i++){
   

     body.innerHTML+="<tr>"
       +"<td>"+inhalt[i].id +"</td>"
        +"<td>"+inhalt[i].vorname+"</td>"
        +"<td>"+inhalt[i].nachname+"</td>"
        +"<td>"+inhalt[i].adresse+"</td>"
         +"<td>"+inhalt[i].email+"</td>"
         +"<td>"+inhalt[i].rolle+"</td>"
         +"<td>"+inhalt[i].datum+"</td>"
        +"<td>"+inhalt[i].ort+"</td>"
   + "<td>"
    + (inhalt[i].rolle === "Mitarbeiter"
        ? "<button type='button' onclick=\"loescheMitarbeiter('" + inhalt[i].id + "')\">Löschen</button>"
        : "")
    + "</td>"
    + "</tr>";
   
    }
   }else if(request.status == 401) {
      alert("Sie sind nicht eingeloggt.");
   }else{
      alert("Fehler beim Laden von Mitarbeiter Liste");
    }
  }
 }

request.open("GET","mitarbeiterliste",true);
request.send();
  }


function loescheMitarbeiter(id) {

    if (!confirm("Möchten Sie diese Mitarbeiter wirklich löschen?")) {
        return;
    }

    let request = new XMLHttpRequest();

    request.onreadystatechange = function () {
        if (request.readyState === 4) {
            if (request.status === 200) {
                alert(request.responseText);
                mitarbeiterLaden();

            } else {
                alert("Fehler beim Löschen des Mitarbeiters!");
            }
        }
    }

    request.open("POST", "mitarbeiterloeschen", true);
    request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
    request.send("id=" +id);
}




 window.onload=mitarbeiterLaden;



</script>

</head>
