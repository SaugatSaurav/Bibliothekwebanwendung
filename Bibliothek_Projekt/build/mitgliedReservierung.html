<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="management.css">

<script>
 function ladeExemplar() {
    
    let request = new XMLHttpRequest();

    request.onreadystatechange = function() {
        if(request.readyState == 4){
         if(request.status == 200) {
          
           let daten =JSON.parse(request.responseText);
            let liste =document.getElementById("buchliste");

           liste.innerHTML = "";
            
           if(daten.length == 0) {
               liste.innerHTML = "<h3>Keine reservierte Exemplare vorhanden.</h3>";
                return;
              }


           for(let i=0;i<daten.length; i++) {

            liste.innerHTML +=

                "<div class='buchkarte' data-standort='" + daten[i].standort.toLowerCase() + "'>"
                +"<div class='buchIcon'>📘</div>"
                + "<div class='buchInfo'>"

                +"<h3>Exemplar_ID: "+ daten[i].id+ "</h3>"
                +"<h3>Titel: "+ daten[i].titel+ "</h3>"
                + "<p>Autor: "+ daten[i].autor+ "</p>"
                + "<p>Barcode: "+ daten[i].barcode+ "</p>"
                + "<p>Standort: "+ daten[i].standort + "</p>"
                + "<p>Regal: "+ daten[i].regal+ "</p>"
                + "<p>Genre: "+ daten[i].genre+ "</p>"
                + "<p>Status: " + (daten[i].verfuegbar == 3
                  ? "<span style='color:brown;font-weight:bold'>Reserviert</span>"
                  : "") +"</p>"
                + "</div>"
                + "</div>"
          }
        } else if(request.status == 401) {
             alert("Sie sind nicht eingeloggt.");

        }else if(request.status == 403) {
            alert("Sie sind gesperrt und alle reservierte Exemplar sind wieder verfügbar.");

       }else{
            alert("Fehler beim Laden des reservierte Exemplars");
          }
        }
    };

    request.open("GET", "mitgliedExemplar", true);
    request.send();
}

 window.onload=function(){
 ladeExemplar();
}
 
</script>
</head>

<body>
  
<div class="container">

    <div class="sidebar">

        <h2>Bibliothek</h2>

        <a href="mitglied.html">Home</a>
        <a id="yes" href="#">Reservierten</a>
        <a href="mitgliedWarenkorb.html">Warenkorb</a>
        <a href="mitgliedAusleiheListe.html">Ausleihe Ansehen</a>
        <a href="mitgliedHistory.html">Historie</a>
           
   <form action="logout" method="POST">
     <button type="submit">Logout</button>
   </form>

    </div>

    <div class="content">

        <div class="page-header">
        
            <h1>Reservierten Exemplar</h1>    
      </div>

<div id="buchliste">

      </div>
   
    </div>

</div>

</body>

</html>
