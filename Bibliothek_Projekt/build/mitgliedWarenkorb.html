<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="management.css">

<script>
 function ladeExemplar() {     
     
    let request = new XMLHttpRequest();

    request.onreadystatechange = function() {
      if(request.readyState == 4){
        if(request.status == 200) {

            let daten =JSON.parse(request.responseText);
            let liste =document.getElementById("buchliste");

            liste.innerHTML = "";
             if(daten.length == 0) {
               liste.innerHTML =  "<h3>Keine Exemplare in Warenkorb vorhanden.</h3>";
               return;
             }



         for(let i=0;i<daten.length; i++) {
          
            liste.innerHTML +=

                "<div class='buchkarte' data-standort='" + daten[i].standort.toLowerCase() + "'>"
                +"<div class='buchIcon'>📘</div>"
                + "<div class='buchInfo'>"

                +"<h3>Exemplar_ID: "+ daten[i].id+ "</h3>"
                +"<h3>Titel: "+ daten[i].titel+ "</h3>"
                + "<p>Autor: "+ daten[i].autor+ "</p>"
                + "<p>Barcode: "+ daten[i].barcode+ "</p>"
                + "<p>Standort: "+ daten[i].standort + "</p>"
                + "<p>Regal: "+ daten[i].regal+ "</p>"
                + "<p>Genre: "+ daten[i].genre+ "</p>"
                + "<p>Status: " + (daten[i].stat === 'WARENKORB'
                  ? "<span style='color:brown;font-weight:bold'>Im Warenkorb</span>"
                  : "") +"</p>"
                + "</div>"
                + "</div>"
        }
      } else if(request.status == 401) {
            alert("Sie sind nicht eingeloggt.");

     } else if(request.status == 403) {
            alert(request.responseText);

    }else{
           alert("Fehler beim Laden des Exemplars im Warenkorb");
       }
      }
    };

    request.open("GET", "warenkorb", true);
    request.send();
}


function alleReservieren() {

    if (!confirm("Möchten Sie alle Exemplare im Warenkorb reservieren?")) {
        return;
   }

    let request = new XMLHttpRequest();

    request.onreadystatechange = function () {
        if (request.readyState === 4) {
            if (request.status === 200) {

                alert("Alle Exemplare wurden reserviert.");
                window.location.href = "mitgliedReservierung.html";

            } else if (request.status === 409) {
                alert("Der Warenkorb ist leer.");

            } else if (request.status === 401) {
                alert("Bitte zuerst einloggen.");
                window.location.href ="mitglied_login.html";

            } else {
                alert("Fehler beim Reservieren.");
         }
       }
    };

    request.open("POST","warenkorbAlleReservieren",true);
    request.send();
  }

window.onload=function(){

 ladeExemplar();
}

</script>
</head>

<body>
  
<div class="container">

    <div class="sidebar">

        <h2>Bibliothek</h2>

        <a href="mitglied.html">Home</a>
        <a href="mitgliedReservierung.html">Reservierten</a>
        <a id="yes" href="#">Warenkorb</a>
        <a href="mitgliedAusleiheListe.html">Ausleihe Ansehen</a>
        <a href="mitgliedHistory.html">Historie</a>      
     
  <form action="logout" method="POST">
     <button type="submit">Logout</button>
  </form>

    </div>

    <div class="content">

  <div class="page-header">
    <h1>Mein Warenkorb</h1>

    <button type="button" class="neues-buch-btn" onclick="alleReservieren()">
        Alle reservieren
    </button>
</div>


<div id="buchliste">

  </div>   
    </div>

</div>
</body>

</html>
