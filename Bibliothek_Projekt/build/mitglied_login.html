<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Bibliothekssystem</title>

<link rel="stylesheet" href="index.css">

<script>

function login(){


  let Email=document.getElementById("email").value;
  let Password=document.getElementById("password").value;


  if(!Email || !Password){
    alert("Bitte Füllen Sie alle Felder aus");
    return false;
  }

let request=new XMLHttpRequest();

   request.onreadystatechange= function(){
    if(request.readyState==4){
      if(request.status==200){

        window.location.href="mitglied.html";

     }else if(request.status == 401){
       document.getElementById("error-container").innerText ="Falsche E-Mail oder Passwort!";
     
     }else{
      document.getElementById("error-container").innerText = "Etwas Schief gelaufen. Try Again!";
  }
 }
}
    request.open("POST","mitgliedlogin",true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    request.send("email="+ Email + "&password="+ Password);
  }

</script>

</head>

<body>

<div class="container">



    <div class="sidebar">
        <h2>Bibliothek</h2>
        <a href="index.html">Home</a>
        <a href="verwaltung.html">Management</a>
        <a id="yes" href="#">Mitglied</a>
    </div>

    <div class="content">

        <div class="header">

            <h1>
                Bibliothek Webanwendung
            </h1>

        </div>




        <main class="main-content">

            <div class="formular">

                <h1>Login</h1>

      <form>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button onclick="login()" type="button">Login</button>
    </form><br>

                <p id="error-container" class="error-container"></p>


                <p>
                    Don't have an account?

                    <a href="mitglied_register.html">
                        Register here
                    </a>
                </p>

            </div>

        </main>

    </div>

</div>

</body>

</html>
